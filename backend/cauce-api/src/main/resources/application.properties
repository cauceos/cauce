# Common configuration shared by all profiles. No secrets here.
spring.application.name=cauce

# Default profile in the repository is local development. Override elsewhere
# with SPRING_PROFILES_ACTIVE (e.g. "prod").
spring.profiles.active=dev

# Disable open-in-view (anti-pattern); transactions belong in service layer.
spring.jpa.open-in-view=false

# API JSON convention: snake_case for all property names (e.g. parent_tenant_id,
# model_provider, created_at). Applied globally here rather than with per-field
# @JsonProperty annotations. Explicit @JsonProperty (e.g. on ErrorResponse) still wins.
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- Observability ---
# Actuator surface. metrics carries the Micrometer meters cauce-observability derives from
# the orchestration event stream; unlike health/info it sits behind API-key auth (see
# SecurityConfig). Traces, metrics and logs go out over OTLP only (ADR 0011).
management.endpoints.web.exposure.include=health,info,metrics
# health and info are public: the external monitor (ADR 0011, A3) reads the status, never the detail.
# The dev profile shows the detail on a developer's machine.
management.endpoint.health.show-details=never
# ADR 0011: every message is traced (a bar's volume allows it). Spans are exported only when an OTLP
# endpoint is configured (MANAGEMENT_OTLP_TRACING_ENDPOINT, see docs/operations/observability.md).
management.tracing.sampling.probability=1.0
# Spring Security's own spans would only add noise to a message's trace.
management.observations.enable.spring.security=false
# Nor the scheduled jobs' (the worker polls every second): one trace per poll is noise, and an error
# in one would be recorded with its message. The invocation continues the message's trace itself.
management.observations.enable.tasks.scheduled=false
# Metrics are pushed over OTLP only where an operator enables it (MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
# and _URL); off by default, so a development instance pushes nothing.
management.otlp.metrics.export.enabled=false
management.otlp.metrics.export.step=60s
# Delta: each point is what happened in its step, so a series that appears already counting (a new
# agent, a restart) is seen whole; alerts sum the points over a window (scripts/observability).
management.otlp.metrics.export.aggregation-temporality=delta

# Correlation-ready log pattern. requestId is populated per request by RequestIdFilter;
# traceId/spanId are set by Micrometer Tracing inside a traced request or invocation. The :- default
# keeps every placeholder an inert no-op when its MDC value is absent.
logging.pattern.correlation=[${spring.application.name:},%X{requestId:-},%X{invocationId:-},%X{traceId:-},%X{spanId:-}]
