# Integration-test configuration. Datasource pair wired by
# AbstractGovernanceIntegrationTest's @DynamicPropertySource.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Surface the RlsContextAspect debug log that confirms set_config runs.
logging.level.dev.cauce=DEBUG

# Disable the scheduled audit drainer: the ITs drive draining manually so tests stay
# deterministic and do not race the @Scheduled trigger.
cauce.governance.audit.drainer.enabled=false
