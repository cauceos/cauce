# Integration-test configuration. Datasource pair provided by
# AbstractChannelsIntegrationTest via @DynamicPropertySource.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Surface the RlsContextAspect debug log that confirms set_config runs.
logging.level.dev.cauce=DEBUG

# The orchestration worker/reaper beans are on the classpath (channels depends on
# orchestration); keep them off so ITs stay deterministic. The channels ITs only assert
# the queued state, never the processed reply.
cauce.orchestration.worker.enabled=false
cauce.orchestration.worker.reaper.enabled=false
