# Integration-test configuration. Datasource provided by Testcontainers
# via @ServiceConnection.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Surface the RlsContextAspect debug log that confirms set_config runs.
logging.level.dev.cauce=DEBUG

# The governance audit drainer is on the test classpath (the outbox adapter backs the
# core AuditEventRecorder port); keep it off - the admin IT drains by hand.
cauce.governance.audit.drainer.enabled=false
