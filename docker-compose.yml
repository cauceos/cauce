# Local development stack for Cauce: PostgreSQL (with pgvector), Redis, Adminer.
#
# NOT for production. The default credentials below are intentionally insecure
# and exist only to make local onboarding frictionless.
#
# Usage (from the repo root):
#   docker compose up -d      # start infra only (dev flow: pair with bootRun)
#   docker compose ps         # check health
#   docker compose down       # stop, keep data
#   docker compose down -v    # stop and wipe volumes
#
# Quickstart (the app in a container, no local JDK needed — see QUICKSTART.md):
#   docker compose --profile quickstart up -d --build   # app + Ollama in containers (no cost)
#   docker compose --profile api up -d --build          # app only: Anthropic (ANTHROPIC_API_KEY
#                                                       # in .env) or your own Ollama (OLLAMA_BASE_URL)
#
# Devs running bootRun who only want a local Ollama:
#   docker compose --profile ollama up -d
#
# Observability backend (OpenObserve: traces, metrics, logs, alerts; ADR 0011),
# see docs/operations/observability.md:
#   docker compose --profile observability up -d
#
# Names are per clone: the project is named after the clone's directory (Compose's default),
# so containers are <dir>-<service>-1 and volumes <dir>_<volume>. Two clones in directories of
# different names never share a container or a database; for two clones under the same name,
# set COMPOSE_PROJECT_NAME in one's .env.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cauce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cauce_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cauce_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cauce} -d ${POSTGRES_DB:-cauce_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  adminer:
    image: adminer:4-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Quickstart profiles -----------------------------------------------------
  # The services below only start with a profile: `quickstart` is the app and Ollama,
  # `api` the app alone, `ollama` Ollama alone. A plain `docker compose up -d` stays
  # infra-only, so the regular dev flow (compose up + bootRun) is unchanged.

  # Pinned: the image is the bulk of the first download (≈3.4 GB compressed), and its size
  # and behaviour change between releases.
  ollama:
    image: ollama/ollama:0.40.8
    profiles: [quickstart, ollama]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: pulls the default model into the ollama volume, then exits.
  # Re-runs are cheap (the model is already in the ollama-data volume).
  ollama-init:
    image: ollama/ollama:0.40.8
    profiles: [quickstart, ollama]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

  cauce-api:
    build: ./backend
    profiles: [quickstart, api]
    # Generates the audit signing key on the first start (kept in the audit-keys volume),
    # then starts the app signing with it: docker/quickstart/start-api.sh.
    entrypoint: ["sh", "/opt/cauce/start-api.sh"]
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - audit-keys:/app/audit-keys
      - ./docker/quickstart/start-api.sh:/opt/cauce/start-api.sh:ro
    # Lets OLLAMA_BASE_URL reach an Ollama on the host, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # The dev profile points at localhost; inside the compose network the
      # services live under their service names. Credentials keep the dev-profile
      # defaults (cauce_app / owner roles), created by the postgres init scripts.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cauce_dev}
      CAUCE_ADMIN_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cauce_dev}
      CAUCE_ADMIN_DATASOURCE_USERNAME: ${POSTGRES_USER:-cauce}
      CAUCE_ADMIN_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cauce_dev}
      SPRING_DATA_REDIS_HOST: redis
      # The containerized Ollama by default; your own with
      # OLLAMA_BASE_URL=http://host.docker.internal:11434/v1 in .env (and --profile api).
      CAUCE_LLM_OPENAICOMPATIBLE_PROVIDERS_OLLAMA_BASEURL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      # Registers the Anthropic provider when set (in .env: compose reads it from there and
      # passes it on). Blank, the provider stays off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # CPU inference loads the model on first request; the 60s default is too
      # tight for that cold load on modest hardware.
      CAUCE_LLM_OPENAICOMPATIBLE_PROVIDERS_OLLAMA_TIMEOUT: 180s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Only when the profile starts it: under `--profile api` there is none to wait for.
      ollama:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- Observability profile ---------------------------------------------------
  # Only with `--profile observability`. The application exports to it over OTLP when
  # MANAGEMENT_OTLP_* point here; alerts are provisioned by scripts/observability/provision.sh.
  openobserve:
    image: openobserve/openobserve:v1.0.4
    profiles: [observability]
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:-root@cauce.local}
      # OpenObserve refuses to start with a weak one: 8+ characters, upper, lower, digit and symbol.
      ZO_ROOT_USER_PASSWORD: "${OPENOBSERVE_ROOT_PASSWORD:-CauceDev_2026!}"
      ZO_DATA_DIR: /data
      # Ids only ever reach it (ADR 0011, L2, T3); a month is enough to follow an incident.
      ZO_COMPACT_DATA_RETENTION_DAYS: ${OPENOBSERVE_RETENTION_DAYS:-30}
      ZO_TELEMETRY: "false"
    ports:
      - "${OPENOBSERVE_PORT:-5080}:5080"
    volumes:
      - observe-data:/data

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  observe-data:
  audit-keys:
