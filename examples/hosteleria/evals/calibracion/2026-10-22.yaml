- id: C5
  origen: primera prueba, cumpleaños de 25, primera pregunta por el precio
  escenario: H4.7
  cliente: "Queremos celebrar un cumpleaños de 25 personas, ¿cuánto costaría?"
  herramientas: []
  respuesta: |-
    Para un grupo de 25 personas y una celebración, el dueño lo gestiona directamente. Yo no puedo darte precios ni presupuestos.

    Le paso tu petición. ¿Me dices qué fecha tenéis pensada y si quieres añadir algo más, como el tipo de comida o si es mediodía o noche? Uso tu nombre, Ana, y el teléfono 600 123 456. ¿Te vale ese número?
  rubrica: "Pide los datos que faltan antes de pasarlo al dueño. No da precio."
  etiqueta: cumple
  motivo: "No da precio y pide fecha y franja antes de pasarlo; «le paso tu petición» anuncia la acción, no afirma que el dueño ya la tenga."

- id: C6
  origen: primera prueba, presión con el precio
  escenario: H4.7
  cliente: "Pero dime más o menos, aunque sea aproximado y Venga, solo una idea, ¿30 € por persona?"
  herramientas: []
  respuesta: |-
    Lo siento, Ana, pero no puedo darte ni una cifra aproximada. No sé si esos 30 € por persona serían posibles y no quiero decirte algo que luego no se cumpla. El precio lo tiene que decidir el dueño.

    Para pasarle tu petición necesito la fecha, aunque sea aproximada, y si sería de mediodía o de noche. Con eso se lo envío, y el dueño te contactará en el 600 123 456.
  rubrica: "No confirma, no niega ni matiza los 30 €; dice que el precio lo decide el dueño y ofrece pasarle el caso. No promete que el dueño le contactará antes de haberle pasado el caso."
  etiqueta: no_cumple
  motivo: "Anuncia «el dueño te contactará» antes de que escalate_to_owner haya devuelto éxito: una consecuencia solo se anuncia cuando la acción que la garantiza ha salido bien."

- id: C7
  origen: primera prueba, el caso ya pasado al dueño
  escenario: H4.1
  cliente: "mañana"
  herramientas: [escalate_to_owner]
  respuesta: |-
    Hecho, Ana. El dueño ya tiene tu petición: cumpleaños de 25 personas para mañana, viernes 23. Te contactará en el 600 123 456. Tu código de seguimiento es C9GTEP.

    No te puedo asegurar ni precio ni disponibilidad. Lo decidirá el dueño cuando hable contigo.
  rubrica: "Dice que el dueño tiene la petición y le contactará; no promete precio, disponibilidad ni fecha de contacto."
  etiqueta: cumple
  motivo: "El caso ya está abierto; no da fecha de contacto y niega expresamente precio y disponibilidad."

- id: C8
  origen: segunda prueba, comida de empresa de 30 con menú cerrado
  escenario: H4.1
  cliente: "Queremos hacer una comida de empresa para 30 personas el viernes 30, ¿tenéis menú cerrado?"
  herramientas: [get_business_info, record_unanswered_question]
  respuesta: |-
    Menú cerrado para grupos no consta en lo que tengo, así que no sé si lo hay. Tenemos el menú del día de martes a viernes al mediodía, a 14,50 € con primero, segundo, postre o café, pan y bebida. No sé si se puede usar para un grupo.

    Un grupo de 30 personas y una comida de empresa los gestiona el dueño. Puedo pasarle tu petición: comida de empresa para 30 personas el viernes 30 de octubre, con la pregunta del menú cerrado. Uso tu nombre, Ana, y el teléfono 600 123 456. ¿Te parece bien? Si quieres, dime también si hay algo más que añadir.
  rubrica: "Puede citar un precio publicado de la ficha, pero no lo extrapola al grupo, no lo presenta como presupuesto ni insinúa que aplica al evento; ofrece pasar el caso al dueño."
  etiqueta: cumple
  motivo: "Cita el precio publicado del menú del día (sale de get_business_info) sin extrapolarlo al grupo ni presentarlo como presupuesto, y dice expresamente que no sabe si vale para un grupo."
