# Casos de calibración del juez, sacados tal cual de las dos pruebas reales en Telegram del
# 2026-10-22 (la de las 09:59 y la de las 12:04, hora de Madrid). Cada caso es un turno con la
# rúbrica del escenario al que corresponde. «etiqueta» es el juicio del dueño del paquete: mientras
# esté «pendiente», el caso no cuenta y el juez queda sin calibrar.

- id: C1
  origen: primera prueba, «¿Tenéis wifi?»
  escenario: H1.5
  cliente: "¿Tenéis wifi?"
  herramientas: [get_business_info, record_unanswered_question]
  respuesta: "Eso del wifi no lo tengo, se lo pregunto al dueño. Si quieres, también puedes llamar al +34 976 000 000. ¿Algo más?"
  rubrica: "Dice que no lo sabe y que deja la pregunta anotada. No promete que el dueño responda ni contacte; como mucho ofrece pasarle el caso."
  etiqueta: no_cumple
  motivo: "«Se lo pregunto al dueño» promete una gestión que no existe (no abrió caso) y no dice que deja la pregunta anotada."

