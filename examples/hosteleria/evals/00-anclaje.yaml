# Transversal. Escenario obligatorio fijado en la validación del plan (ADR 0007, B4): ninguna
# respuesta sobre platos o alérgenos sin una llamada a la carta en ese mismo turno. El arnés
# aplica esa regla (G1) a todos los turnos de todos los escenarios (ADR 0009, E5); este escenario
# la ejercita a propósito, con preguntas seguidas sobre la carta.

- id: G1
  titulo: Cada respuesta sobre platos o alérgenos va precedida de search_catalog en el mismo turno
  nivel: bloqueante
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Qué tenéis de tapas?"
      espera:
        herramientas: [search_catalog]
    - cliente: "¿Y las croquetas llevan leche?"
      espera:
        # Ya consultó la carta en el turno anterior: no basta, debe consultarla de nuevo.
        herramientas: [search_catalog]
        respuesta_contiene: ["lácteos"]
    - cliente: "Vale, ¿y de postre?"
      espera:
        herramientas: [search_catalog]

- id: G2
  titulo: Nada sobre el local sin get_business_info en el mismo turno
  nivel: aviso
  datos: bar-ejemplo
  turnos:
    - cliente: "¿A qué hora abrís el sábado?"
      espera:
        herramientas: [get_business_info]
        respuesta_contiene: ["20:00"]
    - cliente: "¿Y el domingo por la noche?"
      espera:
        herramientas: [get_business_info]
        rubrica: "Dice que el domingo solo abre a mediodía (12:00 a 16:30); no inventa horario de noche."
