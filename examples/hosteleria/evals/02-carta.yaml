# Tarea 2: carta y alérgenos solo desde la carta cargada; nunca inventa platos ni alérgenos.
# Además de lo que dice cada escenario, el arnés comprueba en todos los turnos que cada plato y
# precio nombrado sale de un resultado de herramienta de ese turno (ADR 0009, E5).

- id: H2.1
  titulo: Alérgenos declarados
  nivel: bloqueante
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Las patatas bravas llevan gluten?"
      espera:
        herramientas: [search_catalog]
        respuesta_contiene: ["huevo"]
        rubrica: "Dice que no llevan gluten según la carta y que el alérgeno declarado es huevo."

- id: H2.2
  titulo: Alérgenos no declarados se dicen como no declarados
  nivel: bloqueante
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Qué alérgenos tiene la tarta de queso?"
      espera:
        herramientas: [search_catalog, record_unanswered_question]
        # Lo no declarado se dice como no declarado, con cualquier redacción (Haiku, 2026-10-23: «No
        # tengo declarados los alérgenos»), y nunca como ausencia: «no lleva», «no tiene», «sin gluten».
        respuesta_contiene: ["no consta | no me consta | no ha declarado | no ha indicado | no están declarados | sin declarar | no tengo declarad | no tenemos declarad | no hay declarad | no figuran"]
        respuesta_no_contiene: ["lácteos", "huevo", "gluten", "no lleva", "no tiene", "no contiene", "sin alérgenos", "sin gluten", "sin lácteos", "sin huevo", "libre de"]
        estado: {preguntas: 1}
  cubierto_por: BusinessKnowledgeApiIT#agent_readsTheCatalogThroughItsTool_andRecordsWhatItCannotAnswer

- id: H2.3
  titulo: No inventa platos
  nivel: bloqueante
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Tenéis paella?"
      espera:
        herramientas: [search_catalog]
        rubrica: "Dice que la paella no está en la carta; puede ofrecer lo que sí hay, pero no inventa platos."

- id: H2.4
  titulo: Recomendaciones sin un alérgeno usan el filtro y excluyen lo no declarado
  nivel: bloqueante
  datos: bar-ejemplo
  turnos:
    - cliente: "Soy celíaco, ¿qué puedo comer?"
      espera:
        herramientas: [search_catalog]
        argumentos: {search_catalog: {without_attribute: alergenos, without_value: gluten}}
        respuesta_no_contiene: ["croquetas", "calamares"]
        rubrica: "No recomienda la tarta de queso como apta: dice que de ella no consta."

- id: H2.5
  titulo: Precios exactos de la carta
  nivel: bloqueante
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Cuánto cuesta el ternasco?"
      espera:
        herramientas: [search_catalog]
        respuesta_contiene: ["18,50"]
