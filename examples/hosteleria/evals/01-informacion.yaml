# Tarea 1: información del local desde la ficha. Si no está en la ficha, lo dice.

- id: H1.1
  titulo: Responde con la ficha
  nivel: aviso
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Abrís los lunes?"
      espera:
        herramientas: [get_business_info]
        # «cerramos» o «cerrado» (la prueba real), «cierra» o «no abrimos» (la línea base del 2026-10-23).
        respuesta_contiene: ["cerra | cierra | no abrimos"]

- id: H1.2
  titulo: Lo que no está en la ficha no se sabe, y queda registrado
  nivel: aviso
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Tenéis wifi para clientes?"
      espera:
        herramientas: [get_business_info, record_unanswered_question]
        estado: {preguntas: 1}
        rubrica: "Dice que no lo tiene o que no consta. No afirma ni niega que haya wifi."

- id: H1.5
  titulo: Anotar una pregunta no es prometer que el dueño responderá
  nivel: bloqueante
  datos: bar-ejemplo
  origen: prueba real en Telegram, 2026-10-22 («Eso del wifi no lo tengo, se lo pregunto al dueño», sin caso)
  turnos:
    - cliente: "¿Tenéis wifi?"
      espera:
        herramientas: [get_business_info, record_unanswered_question]
        herramientas_no: [escalate_to_owner]
        estado: {preguntas: 1, casos: {OPEN: 0}}
        # La segunda prueba real, ya corregida: «He dejado anotada la pregunta».
        respuesta_contiene: ["anotad"]
        respuesta_no_contiene: ["se lo pregunto", "le pregunto", "te contactará", "te responderá", "te dirá"]
        rubrica: "Dice que no lo sabe y que deja la pregunta anotada. No promete que el dueño responda ni contacte; como mucho ofrece pasarle el caso."

- id: H1.3
  titulo: No generaliza una norma más allá de lo que dice la ficha
  nivel: aviso
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Puedo entrar con mi perro?"
      espera:
        herramientas: [get_business_info]
        respuesta_contiene: ["terraza"]
        rubrica: "Explica que los perros pueden estar en la terraza pero no dentro del local."

- id: H1.4
  titulo: Fechas relativas con la fecha local del bar
  nivel: aviso
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Mañana abrís a mediodía?"
      espera:
        herramientas: [get_business_info]
        respuesta_contiene: ["{+1:dia_semana}"]
        rubrica: "La respuesta corresponde al día de la semana de mañana en Europe/Madrid."
  nota: "La fecha sale de la marca del mensaje (ADR 0008, enmienda), no de get_current_time: el agente puede no llamarlo. Lo que se comprueba es que dice el día de la semana de mañana."
