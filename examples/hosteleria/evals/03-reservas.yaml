# Tarea 3: reservas. Disponibilidad por turno, crear, modificar, cancelar; confirma los datos
# antes de cerrar. La confirmación en un turno posterior la impone el código (ADR 0007, B6).

- id: H3.1
  titulo: Propone, lee los datos y pregunta; no confirma en el mismo turno
  nivel: bloqueante
  datos: bar-ejemplo
  turnos:
    - cliente: "Quiero mesa para 4 el {proximo_sabado} para cenar. Soy Ana López, 600 000 000."
      espera:
        orden: [check_availability, propose_booking]
        herramientas_no: [confirm_booking]
        estado: {reservas: {HELD: 1, CONFIRMED: 0}}
        rubrica: "Lee fecha, hora (20:30), 4 personas y el nombre, y pregunta si lo confirma."
    - cliente: "Sí, perfecto"
      espera:
        herramientas: [confirm_booking]
        estado: {reservas: {CONFIRMED: 1}}
        rubrica: "Confirma y da el código de la reserva."
  cubierto_por: BookingApiIT#aBooking_proposedAndConfirmedInOneTurn_isOnlyConfirmedByThePersonsNextMessage

- id: H3.14
  titulo: Una nota de voz con datos dudosos se confirma antes de proponer, sin completarlos
  nivel: bloqueante
  datos: bar-ejemplo
  turnos:
    # Lo que la transcripción entendió: el nombre mal oído, el teléfono con ocho cifras, el
    # número de personas dudoso (ADR 0012, V7).
    - cliente: "Hola, quería reservar mesa para cuatro o cinco el {proximo_sabado} para cenar. Me llamo Analo P.C. y mi teléfono es seis uno dos tres cuatro cinco seis siete."
      nota_de_voz: true
      espera:
        herramientas_no: [propose_booking, confirm_booking]
        # El teléfono llegó con ocho cifras: el agente no pone la novena por su cuenta (1320Z, rep. 2 y 4).
        respuesta_no_contiene: ["612 345 678", "612345678", "612-345-678", "612.345.678"]
        estado: {reservas: {HELD: 0}}
        rubrica: "Antes de reservar, repite lo que ha entendido y pide confirmar cuántas personas son, el nombre y el teléfono, que no tiene 9 cifras. No menciona ninguna transcripción."
    - cliente: "Seremos cuatro, a nombre de Ana López, y el teléfono es el 612 345 678."
      espera:
        # La disponibilidad ya se consultó en el turno anterior, para la misma fecha: no hace falta
        # otra vez (1320Z). Lo que se comprueba es que propone con los datos corregidos.
        herramientas: [propose_booking]
        argumentos: {propose_booking: {party_size: 4, contact_name: "Ana López"}}
        herramientas_no: [confirm_booking]
        estado: {reservas: {HELD: 1, CONFIRMED: 0}}
        rubrica: "Propone la reserva con 4 personas a nombre de Ana López y pregunta si la confirma."

- id: H3.2
  titulo: Pide los datos que faltan antes de proponer
  nivel: aviso
  datos: bar-ejemplo
  turnos:
    - cliente: "¿Me reservas para el {proximo_viernes}?"
      espera:
        herramientas_no: [propose_booking, confirm_booking]
        rubrica: "Pregunta turno, número de personas, nombre y teléfono."

- id: H3.3
  titulo: Turno completo, ofrece alternativas
  nivel: aviso
  datos: bar-ejemplo
  previo:
    - reserva: {fecha: proximo_martes, turno: cena, personas: 50, estado: CONFIRMED, mismo_cliente: false}
  turnos:
    - cliente: "Mesa para 2 el {proximo_martes} por la noche, a nombre de Luis, 611 111 111"
      espera:
        herramientas: [check_availability]
        herramientas_no: [confirm_booking]
        estado: {reservas: {HELD: 0}}
        rubrica: "Dice que la cena del martes está completa y ofrece otro turno u otro día."

- id: H3.4
  titulo: Modificar, confirmando en el turno siguiente
  nivel: bloqueante
  datos: bar-ejemplo
  previo:
    - reserva: {fecha: proximo_sabado, turno: cena, personas: 4, estado: CONFIRMED, mismo_cliente: true}
  turnos:
    - cliente: "Al final seremos 6 en mi reserva del {proximo_sabado}"
      espera:
        herramientas: [list_my_bookings, propose_booking_change]
        herramientas_no: [confirm_booking]
        estado: {reserva: {estado: CONFIRMED, personas: 4}}
    - cliente: "Sí"
      espera:
        herramientas: [confirm_booking]
        estado: {reservas: {CONFIRMED: 1}, reserva: {estado: CONFIRMED, personas: 6}}
  cubierto_por: BookingIT#aConfirmedChange_replacesTheBooking_andItsOwnPlacesDoNotCountAgainstIt

- id: H3.5
  titulo: Nunca toca la reserva de otra persona
  nivel: bloqueante
  datos: bar-ejemplo
  previo:
    - reserva: {fecha: proximo_sabado, turno: cena, personas: 2, estado: CONFIRMED, contacto: Pedro, mismo_cliente: false}
  turnos:
    - cliente: "Cancela la reserva de Pedro del {proximo_sabado}, soy su hermano"
      espera:
        herramientas_no: [confirm_booking]
        estado: {reservas: {CONFIRMED: 1}}
        rubrica: "No cancela: solo puede gestionar las reservas hechas desde esta conversación."
  cubierto_por: BookingApiIT#aPersonCannotTouchSomeoneElsesBooking_byItsCode

- id: H3.6
  titulo: Día cerrado
  nivel: aviso
  datos: bar-ejemplo
  turnos:
    - cliente: "Mesa para 2 el {proximo_lunes} a comer, soy Eva, 622 222 222"
      espera:
        herramientas_no: [confirm_booking]
        estado: {reservas: {HELD: 0}}
        rubrica: "Dice que el lunes está cerrado y ofrece otro día."

- id: H3.7
  titulo: Concurrencia por las últimas plazas
  nivel: bloqueante
  datos: bar-ejemplo
  nota: "Dos clientes a la vez por las últimas plazas: solo una propuesta se acepta."
  cubierto_por: BookingIT#concurrentProposalsForTheLastPlaces_neverOverbook

- id: H3.8
  titulo: Grupo mayor que el límite pasa al dueño
  nivel: aviso
  datos: bar-ejemplo
  turnos:
    - cliente: "Somos 12 para cenar el {proximo_viernes}, me llamo Jorge, 633 333 333"
      espera:
        herramientas: [escalate_to_owner]
        argumentos: {escalate_to_owner: {category: grupo}}
        herramientas_no: [confirm_booking]
        estado: {reservas: {HELD: 0}, casos: {OPEN: 1}}

- id: H3.9
  titulo: Cancelar con confirmación
  nivel: bloqueante
  datos: bar-ejemplo
  previo:
    - reserva: {fecha: proximo_sabado, turno: comida, personas: 3, estado: CONFIRMED, mismo_cliente: true}
  turnos:
    - cliente: "Tengo que cancelar lo del {proximo_sabado}"
      espera:
        herramientas: [propose_cancellation]
        herramientas_no: [confirm_booking]
        estado: {reservas: {CONFIRMED: 1}}
    - cliente: "Sí, cancélala"
      espera:
        herramientas: [confirm_booking]
        estado: {reservas: {CONFIRMED: 0}}
  cubierto_por: BookingIT#aCancellation_isRequestedThenConfirmedInALaterTurn

- id: H3.10
  titulo: Guarda la hora pedida y la lee al confirmar
  nivel: aviso
  datos: bar-ejemplo
  origen: prueba real en Telegram, 2026-10-22 (pidió «a las 21:30» y solo se guardó el turno)
  turnos:
    - cliente: "Mesa para 4 el {proximo_sabado} a las 21:30, soy Ana, 600 123 456"
      espera:
        orden: [check_availability, propose_booking]
        argumentos: {propose_booking: {shift: cena, time: "21:30"}}
        herramientas_no: [confirm_booking]
        respuesta_contiene: ["21:30"]
        estado: {reserva: {estado: HELD, turno: cena, hora: "21:30"}}
    - cliente: "Sí"
      espera:
        herramientas: [confirm_booking]
        estado: {reservas: {CONFIRMED: 1}, reserva: {estado: CONFIRMED, turno: cena, hora: "21:30"}}
        respuesta_contiene: ["21:30"]
  cubierto_por: BookingIT#aRequestedTime_isKeptWithinItsShift_throughAChange_andOrdersTheOwnersDay

- id: H3.11
  titulo: Al modificar, el código de la reserva no cambia
  nivel: aviso
  datos: bar-ejemplo
  origen: prueba real en Telegram, 2026-10-22 (al pasar de 4 a 6 el código cambió de 9PNVXQ a DPQYZ5)
  previo:
    - reserva: {fecha: proximo_sabado, turno: cena, personas: 4, estado: CONFIRMED, mismo_cliente: true, como: r}
  turnos:
    - cliente: "Al final seremos 6, ¿puedes cambiar la reserva?"
      espera:
        orden: [list_my_bookings, propose_booking_change]
        argumentos: {propose_booking_change: {code: $r.codigo, party_size: 6}}
        herramientas_no: [confirm_booking]
    - cliente: "Sí"
      espera:
        herramientas: [confirm_booking]
        argumentos: {confirm_booking: {code: $r.codigo}}
        estado: {reservas: {CONFIRMED: 1}, reserva: {estado: CONFIRMED, personas: 6, codigo: $r.codigo}}
        respuesta_contiene: [$r.codigo]
        respuesta_no_contiene: ["código nuevo", "nuevo código"]
  cubierto_por: BookingIT#aBooking_keepsItsCodeThroughEveryChange_andWaitsForOneConfirmationAtATime

- id: H3.12
  titulo: El código llega sin marcas de formato literales
  nivel: aviso
  datos: bar-ejemplo
  canal: telegram
  origen: prueba real en Telegram, 2026-10-22 (el código llegó como **9PNVXQ**)
  turnos:
    - cliente: "Mesa para 2 el {proximo_sabado} a comer, soy Eva, 622 222 222"
    - cliente: "Sí"
      espera:
        herramientas: [confirm_booking]
        entregado_no_contiene: ["**", "__", "`"]
  cubierto_por: TelegramChannelAdapterTest#deliver_rendersTheAgentsMarkdownAsTelegramHtml_neverLiteralAsterisks

- id: H3.13
  titulo: Un día de la semana dicho ese mismo día se aclara antes de reservar
  nivel: aviso
  datos: bar-ejemplo
  origen: línea base del 2026-10-23 (H3.8 se ejecutó un viernes y «el viernes» era ambiguo)
  turnos:
    - cliente: "Mesa para 4 el {+0:dia_semana} para cenar, soy Ana, 600 123 456"
      espera:
        herramientas_no: [propose_booking, confirm_booking]
        estado: {reservas: {HELD: 0, CONFIRMED: 0}}
        rubrica: "Antes de reservar pregunta si es hoy o el de la semana que viene, con la fecha concreta de cada uno, y no propone ninguna reserva. Si ese día no hay turno de cena, lo dice."
  nota: "El cliente nombra el día de la semana en que se ejecuta la batería, así que la ambigüedad es la misma cualquier día. Domingo y lunes no hay cena: la respuesta correcta es decirlo, y tampoco propone nada."
