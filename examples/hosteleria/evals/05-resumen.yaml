# Tarea 5: resumen nocturno al dueño. Determinista, sin modelo (ADR 0007, B10): estos
# escenarios no necesitan juez; comprueban el texto y los registros.

- id: H5.1
  titulo: El resumen trae las reservas de mañana, los casos pendientes y las preguntas sin respuesta
  obligatorio: true
  datos: bar-ejemplo
  previo:
    - reserva: {fecha: +1, turno: cena, personas: 4, estado: CONFIRMED, contacto: Ana López}
    - caso: {categoria: evento, contacto: Marta, estado: OPEN}
    - pregunta_sin_respuesta: "¿Tenéis wifi?"
  accion: resumen_de_hoy
  espera:
    resumen_contiene: ["Ana López", "[evento]", "Marta", "¿Tenéis wifi?", "Reservas (1 · 4 comensales)"]
    estado: {avisos_al_dueno: {DAILY_DIGEST: 1}}
  cubierto_por: DigestIT#theSummary_reportsTomorrowTheOpenCasesAndTheQuestions_andIsSentOncePerDay

- id: H5.2
  titulo: Ejecutarlo dos veces no duplica
  obligatorio: true
  datos: bar-ejemplo
  accion: [resumen_de_hoy, resumen_de_hoy]
  espera:
    estado: {resumenes_de_hoy: 1, avisos_al_dueno: {DAILY_DIGEST: 1}}
  cubierto_por: DigestIT#theScheduler_runsOnlyTheBusinessesThatWantASummary_andOnlyOnce

- id: H5.3
  titulo: Día sin nada
  obligatorio: true
  datos: bar-ejemplo
  accion: resumen_de_hoy
  espera:
    resumen_contiene: ["Nada pendiente."]
    nota: "Con daily_digest_skip_when_empty = true se registra pero no se envía."
  cubierto_por: DigestIT#anEmptyDay_ofABusinessThatSkipsThem_isRecordedButNotSent

- id: H5.4
  titulo: Solo las preguntas desde el resumen anterior
  obligatorio: true
  datos: bar-ejemplo
  cubierto_por: DigestIT#theQuestions_areThoseSinceThePreviousSummary

- id: H5.5
  titulo: Dueño en WhatsApp fuera de la ventana de 24 h
  obligatorio: true
  datos: bar-ejemplo
  previo:
    - dueno_vinculado: whatsapp
    - ultimo_mensaje_del_dueno: "-25h"
  accion: resumen_de_hoy
  espera:
    estado: {avisos_no_enviados: {outside_reply_window: 1}}
    nota: "El resumen queda registrado y legible en GET /v1/tenants/{id}/daily-digests."
