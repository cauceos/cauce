version: 2

updates:
  # GitHub Actions used by workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Backend Gradle build (settings.gradle.kts lives in /backend).
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)

  # Frontend npm — the React playground (frontend/playground/package.json).
  - package-ecosystem: npm
    directory: /frontend/playground
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
