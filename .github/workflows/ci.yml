name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on PRs; never cancel on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build backend
        working-directory: backend
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: backend/**/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # The reference audit-chain verifier (tools/audit-chain-verifier) is written against
  # docs/spec/audit-chain-format.md and imports no Cauce code. Its self-test replays every
  # vector the spec publishes plus a sample chain under mutation, so a change to the format
  # that the spec does not describe fails here as well as in the Java test suite.
  verifier-self-test:
    name: Audit chain verifier self-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Self-test against the specification's vectors
        run: node tools/audit-chain-verifier/verify.mjs --self-test

  # Smoke-builds the quickstart image (backend/Dockerfile) so it cannot rot
  # unnoticed. Compile-and-package only — tests run in backend-build.
  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build quickstart image
        run: docker build backend
